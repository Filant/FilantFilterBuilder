name: Build AdGuard Blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B clean package

      - run: |
          java -jar target/filtersmith-0.1.0-SNAPSHOT.jar build \
            --config filtersmith.example.yml \
            --profile balanced

      - name: Publish generated blocklist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p publish
          cp dist/filtersmith-balanced.txt publish/adguard.txt
          git fetch origin generated || true
          git checkout --orphan generated
          git rm -rf . || true
          cp publish/adguard.txt adguard.txt
          git add adguard.txt
          git commit -m "chore: update generated blocklist"
          git push --force origin generated
