name: Build AdGuard Blocklist

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "FilterSmith profile to publish"
        required: true
        default: "lite"
        type: choice
        options:
          - lite
          - balanced
          - aggressive
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ github.event.inputs.profile || 'lite' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B clean package

      - name: Build selected profile
        run: |
          java -jar target/filtersmith-0.1.0-SNAPSHOT.jar build \
            --config filtersmith.example.yml \
            --profile "$PROFILE"

          if [ "$PROFILE" != "lite" ]; then
            java -jar target/filtersmith-0.1.0-SNAPSHOT.jar build \
              --config filtersmith.example.yml \
              --profile lite
          fi

      - name: Publish generated blocklists
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p publish

          cp "dist/filtersmith-$PROFILE.txt" publish/adguard-selected.txt
          cp "dist/filtersmith-$PROFILE.txt" publish/adguard.txt
          cp dist/filtersmith-lite.txt publish/adguard-openwrt-lite.txt

          git fetch origin generated || true
          git checkout --orphan generated
          git rm -rf . || true

          cp publish/adguard-selected.txt adguard-selected.txt
          cp publish/adguard.txt adguard.txt
          cp publish/adguard-openwrt-lite.txt adguard-openwrt-lite.txt

          git add adguard-selected.txt adguard.txt adguard-openwrt-lite.txt
          git commit -m "chore: update generated blocklists ($PROFILE)"
          git push --force origin generated
