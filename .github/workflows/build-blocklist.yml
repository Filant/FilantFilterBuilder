name: Build Blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - run: java -jar target/filtersmith-0.1.0-SNAPSHOT.jar build --config filtersmith.example.yml --profile balanced
      - uses: actions/upload-artifact@v4
        with:
          name: filtersmith-blocklists
          path: dist/*.txt
